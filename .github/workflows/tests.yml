name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    name: Scripts and launcher checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The preparation, linking, game-check, patch and mod scripts, with synthetic fixtures. Tests
      # that need the built executable skip here (they run with `bash build.sh --test`).
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        run: bash -n run.sh build.sh launcher/bb-launcher.sh launcher/install-desktop.sh packaging/appimage.sh scripts/build-docker.sh scripts/package-dev.sh launchers/legion-go/*.sh
      - name: Launcher compiles
        run: python3 -m py_compile launcher/sacredfire_launcher.py launcher/ufc3_launcher.py launcher/bbport_i18n.py launcher/bbport_vulkan.py tools/gen_import_names.py tools/import_shadps4_saves.py scripts/*.py
      - name: Patch files parse
        run: python3 -c "import glob, xml.etree.ElementTree as ET; files = glob.glob('patches/*.xml'); [ET.parse(f) for f in files]; print(len(files), 'ok')"
