name: Bug report
description: The game crashes, hangs, looks wrong, runs slowly or will not start.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the port. Please **don't attach or link game files** (eboot.bin, sce_module, .pkg, saves or dumps):
        they are copyrighted and the issue will be closed.

        Before posting, run the diagnostic with the game closed and attach the file it saves:
        ```
        ./ufc3.sh --doctor /path/to/CUSA14204
        ```
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what happened instead.
      placeholder: "Career mode: after the first fight the game freezes on the results screen."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where in the game
      options: [Boot / start-up, Menus, Fight, Career, Online, Other]
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How do you run it
      options: [Release archive, Release archive from Steam (non-Steam game), Built from source, Legion Go launchers]
    validations:
      required: true
  - type: dropdown
    id: fps
    attributes:
      label: Frame rate setting
      options: ["30 FPS", "60 FPS", "Unlimited", "Don't know"]
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Device
      placeholder: "Legion Go, Bazzite, 15 W TDP"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostic report
      description: Drag the doctor-*.txt file here, or paste its contents.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: |
        Whether it happens every time, screenshots or video. For a crash, a log with "Save log" on
        (or BB_SAVE_LOG=1): everything from `STOP` or `Guest fault` to the end. For rendering or
        speed problems, the `Frame stats:` lines.
